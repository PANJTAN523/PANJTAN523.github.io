<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

<title>PANJTAN</title>
<style>
/* ========================= 
   RESET
========================= */
*{
box-sizing:border-box;
margin:0;
padding:0;
}
/* =========================
BODY
========================= */ 
body{
min-height:100vh;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
background:#030712;
color:#e5e7eb;
font-family:
Arial,
Helvetica,
sans-serif;
}
/* =========================
CONTAINER 
========================= */
.container{
width:100%;
max-width:600px;
}
/* =========================
GLASS CARD 
========================= */
.card{
width:100%;
padding:25px;
border:1px solid
rgba(56,189,248,0.35);
border-radius:24px;
background:
rgba(17,24,39,0.70);
backdrop-filter:
blur(12px);
-webkit-backdrop-filter:
blur(12px);
box-shadow:
0 0 35px
rgba(56,189,248,0.08);
}
/* =========================
TITLE
========================= */
h1{
text-align:center;
color:#38bdf8;
font-size:42px;
font-weight:800;
letter-spacing:1px;
}
/* =========================
SUBTITLE 
========================= */
.subtitle{
margin-top:8px;
margin-bottom:25px;
text-align:center;
color:#94a3b8;
font-size:14px;
}
/* =========================
LABEL
========================= */
label{
display:block;
margin-top:15px;
margin-bottom:8px;
color:#e5e7eb;
font-size:14px;
font-weight:bold;
}
/* =========================
INPUTS
========================= */
textarea,
input{
width:100%;
border:1px solid
rgba(56,189,248,0.30);
border-radius:14px;
outline:none;
background:
rgba(3,7,18,0.85);
color:#ffffff;
font-size:16px;
}
textarea{
min-height:230px;
padding:15px;
resize:vertical;
line-height:1.5;
}
input{
height:52px;
padding:0 15px;
}
/* =========================
FOCUS 
========================= */
textarea:focus,
input:focus{
border-color:#38bdf8;
box-shadow:
0 0 15px
rgba(56,189,248,0.15);
}
/* =========================
BUTTON 
========================= */
button{
width:100%;
min-height:52px;
margin-top:14px;
padding:12px;
border:0;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:
opacity .2s ease,
transform .1s ease;
}
button:active{
transform:scale(.99);
}
button:disabled{
opacity:.5;
cursor:not-allowed;
}
/* =========================
LOCK BUTTON 
========================= */
.lock-btn{
background:#38bdf8;
color:#03111c;
}
/* =========================
PASTE BUTTON 
========================= */
.paste-btn{
background:
rgba(56,189,248,0.12);
border:1px solid
rgba(56,189,248,0.30);
color:#38bdf8;
}
/* =========================
COPY BUTTON 
========================= */
.copy-btn{
background:#10b981;
color:#022c22;
}
/* =========================
HIDDEN
========================= */ 
.hidden{
display:none !important;
}
/* =========================
STATUS
========================= */ 
.status{
min-height:24px;
margin-top:15px;
text-align:center;
font-size:14px;
line-height:1.4;
}
.success{
color:#10b981;
}
.error{
color:#f87171;
}
.warning{
color:#fb7185;
}
/* =========================
SECURITY ERROR 
========================= */ 
.security-error{
border-color:#ef4444 !important;
box-shadow:
0 0 18px
rgba(239,68,68,0.25) !important;
}
/* =========================
MOBILE
========================= */ 
@media(max-width:480px){
body{
padding:10px;
align-items:flex-start;
padding-top:20px;
}
.card{
padding:18px;
border-radius:20px;
}
h1{
font-size:34px;
}
textarea
{
min-height:210px;
}
}
.text-actions{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:12px;
}
.text-actions button{
margin-top:0;
background:rgba(56,189,248,0.12);
border:1px solid rgba(56,189,248,0.30);
color:#38bdf8;
}
@media(max-width:480px){
 .text-actions{
grid-template-columns:1fr 1fr 1fr;
gap:7px;
}
.text-actions button{
font-size:14px;
padding:10px 5px;
}
}
</style> 
</head> 
<body> 
<div class="container"> 
<div class="card"> 
<h1> 
PANJTAN 
</h1>
<div class="subtitle"> 
Private Message Locker
</div> 
<label for="message">
Message / Secret Code
</label> 
<textarea
id="message"
placeholder="अपना message लिखें या encrypted code यहाँ  डालें..."  
spellcheck="false"
autocomplete="off"
></textarea>
<div class="text-actions">
<button
id="copyTextButton"
type="button"
>
📋 Copy
</button>
<button
id="clearTextButton"
type="button"
>
🧹 Clear
</button>
<button
id="pasteTextButton"
type="button"
>
📥 Paste
</button>
</div>
<label for="password"> Password 
</label>
<input
id="password" 
type="text" 
placeholder="Password डालें"
autocomplete="new-password"
>
<button 
id="lockButton" 
class="lock-btn" 
type="button"
>
 🔐 सुरक्षित लॉक / अनलॉक करें
</button>  
<div id="status" 
class="status" 
aria-live="polite"
></div>
</div> 
</div>
<script> "use strict";
/* =========================
ELEMENTS 
========================= */
const messageBox = document.getElementById("message");
const passwordBox = document.getElementById("password");
const lockButton = document.getElementById("lockButton"); 
const copyTextButton = document.getElementById("copyTextButton");
const clearTextButton = document.getElementById("clearTextButton");
const pasteTextButton = document.getElementById("pasteTextButton");
const statusBox = document.getElementById("status"); 
/* =========================
   SECURITY SETTINGS
 ========================= */ 
const FORMAT_PREFIX =
"SB99v1"; 
const SALT_LENGTH = 16; 
const IV_LENGTH = 12; 
const PBKDF2_ITERATIONS = 250000; 
/* ========================= 
STATE 
========================= */ 
let wrongAttempts = 0; 
let busy = false; 
/* =========================
   STATUS 
========================= */ 
function setStatus( message, type = "" ){ 
statusBox.textContent = message; 
statusBox.className = "status";
if(type)
{ statusBox.classList.add( type );
}
}
/* ========================= 
SECURITY ERROR CLEAR 
========================= */ 
function clearSecurityError(){
messageBox.classList.remove( "security-error" ); 
passwordBox.classList.remove( "security-error" );
}
/* ========================= 
BUSY STATE 
========================= */ 
function setBusy(value){
    busy = value; 
lockButton.disabled = value; 
copyTextButton.disabled = value;
clearTextButton.disabled = value;
pasteTextButton.disabled = value;
}
/* ========================= 
ENCRYPTED CODE CHECK 
========================= */ 
function isEncryptedCode(text){
return text .trim() .startsWith( FORMAT_PREFIX + "." );
}
/* ========================= 
BYTES → BASE64 
========================= */ 
function bytesToBase64(bytes){
let binary = ""; 
const chunkSize = 0x8000; 
for( let i = 0; 
i < bytes.length; 
i += chunkSize
){ 
binary += 
String.fromCharCode( ...bytes.subarray( 
i, 
i + chunkSize
) 
);
}
return btoa(binary);
}
/* ========================= 
BASE64 → BYTES 
========================= */ 
function base64ToBytes(base64){
const binary = atob(base64); 
const bytes = new Uint8Array( 
binary.length); 
for( 
let i = 0; 
i < binary.length; 
i++ 
){
 bytes[i] = binary.charCodeAt(i);
}
return bytes;
}
/* ========================= 
PASSWORD → AES KEY 
========================= */ 
async function deriveKey(
password, salt ){ 
const encoder = new TextEncoder(); 
const passwordKey = 
await crypto.subtle.importKey
( 
"raw", 
encoder.encode( 
password
), 
{ 
name:"PBKDF2"
},
false, 
[ 
"deriveKey" 
] 
); 
return crypto.subtle.deriveKey(
{ 
name:"PBKDF2", 
salt:salt, 
iterations: PBKDF2_ITERATIONS,
hash:"SHA-256"
},
passwordKey, 
{ 
name:"AES-GCM", 
length:256
},
false, 
[ 
"encrypt", 
"decrypt" 
] 
);
}
/* ========================= 
ENCRYPT 
========================= */ 
async function encryptMessage(
message, 
password 
){ 
const encoder = new TextEncoder(); 
const salt =
crypto.getRandomValues( new Uint8Array( SALT_LENGTH 
) 
);
const iv = 
crypto.getRandomValues( 
new Uint8Array(
IV_LENGTH
) 
); 
const key = await deriveKey( password, salt );
const encrypted = await crypto.subtle.encrypt( 
{ name:"AES-GCM", 
iv:iv, 
tagLength:128
},
key, 
encoder.encode(
 message 
) 
); 
const encryptedBytes =
new Uint8Array( 
encrypted 
); 
return ( 
FORMAT_PREFIX + 
"." + 
bytesToBase64(salt) + 
"." + 
bytesToBase64(iv) +
"." + 
bytesToBase64(encryptedBytes) 
);
}
/* ========================= 
DECRYPT 
========================= */ 
async function decryptMessage(
code, 
password ){ 
const parts = code .trim() .split("."); 
if(
parts.length !== 4 ){ 
throw new Error( 
"INVALID_CODE" 
);
}
if( 
parts[0] !== FORMAT_PREFIX ){ 
throw new Error( 
"INVALID_CODE"
);
}
const salt = base64ToBytes( parts[1] );
const iv = base64ToBytes( parts[2] ); 
const encrypted = base64ToBytes( parts[3]); 
if( 
salt.length !== 
SALT_LENGTH || 
iv.length !== 
IV_LENGTH ||
encrypted.length === 0 
){
 throw new Error( 
"INVALID_CODE"
);
}
const key = await deriveKey( password, salt ); 
const decrypted =
await crypto.subtle.decrypt( 
{ 
name:"AES-GCM", 
iv:iv, 
tagLength:128
},
key, encrypted 
); 
return new TextDecoder() 
.decode( decrypted );
}
/* ========================= 
LOCK 
========================= */ 
async function lockMessage(){
const message = messageBox.value; 
const password = passwordBox.value;
if( 
message.trim() === "" 
){
 setStatus( "पहले message लिखें।", 
"error"
); 
return;
}
if( 
password.length === 0 
){
setStatus( 
"Password डालें।",
"error"
);
passwordBox.focus();
return;
}
if( 
password.length < 6 
){
setStatus( "Password कम से कम 6 characters का रखें।",
"error"
); 
passwordBox.focus();
return;
}
try{ 
setBusy(true); 
clearSecurityError(); 
const encryptedCode =
await encryptMessage( 
message, 
password 
); 
messageBox.value = encryptedCode; 
passwordBox.value = ""; 
wrongAttempts = 0; 
setStatus( "✅ Message सुरक्षित रूप से lock हो गया।",
"success");
}
catch(error){ 
console.error(error); 
setStatus( "Encryption में समस्या हुई।", "error" );
}
finally{ setBusy(false);
}
}
/* ========================= 
UNLOCK 
========================= */ 
async function unlockMessage(){
const code = messageBox.value.trim(); 
const password = passwordBox.value;
if( code === "" ){ 
setStatus( "Encrypted code डालें।", "error"); 
return;
}
if( 
password.length === 0 ){ 
setStatus( "Password डालें।", "error"); 
passwordBox.focus(); 
return;
}
try{ 
setBusy(true); 
clearSecurityError(); 
const message = 
await decryptMessage(
code, 
password 
); 
messageBox.value = message; 
passwordBox.value = ""; 
wrongAttempts = 0; 
setStatus( "✅ Message सफलतापूर्वक unlock हो गया।", 
"success");
}
catch(error){ 
console.error(error); 
wrongAttempts++; 
passwordBox.classList.add( "security-error" ); 
setStatus( "❌ गलत password या invalid code। Attempt " + 
wrongAttempts + "/3", "error"
);
if( 
wrongAttempts >= 3 
){ 
messageBox.classList.add( "security-error" ); 
alert( "🚨 सुरक्षा चेतावनी: जासूसी करना सख्त मना है!" ); 
wrongAttempts = 0; 
setStatus( "⚠️ सुरक्षा चेतावनी दिखाई गई।", "warning" );
}
}
finally{ 
setBusy(false);
}
}
/* ========================= 
COPY / SHARE LINK
========================= */
async function copyText(){
const code = messageBox.value.trim();
if(!code){
setStatus("Copy करने के लिए कुछ भी नहीं है।", "error");
return;
}
if(!isEncryptedCode(code)){
setStatus("पहले message को lock करें।", "error");
return;
}
try{
const shareURL =
window.location.origin +
window.location.pathname +
"?code=" +
encodeURIComponent(code);
const shareText = shareURL + "\n\n🔐 PANJTAN पर खोलें";
await navigator.clipboard.writeText(shareText);
setStatus("🔗 PANJTAN link copy हो गया।", "success");
}catch(error){
messageBox.focus();
setStatus("Link copy नहीं हो सका।", "warning");
}
}
/* =========================
CLEAR TEXTAREA
========================= */
function clearText(){
messageBox.value = "";
passwordBox.value = "";
clearSecurityError();
setStatus("🧹 Text साफ हो गया।", "success");
messageBox.focus();
}
/* =========================
PASTE TEXTAREA
========================= */
async function pasteText(){
try{
const text = await navigator.clipboard.readText();
if(!text.trim()){
setStatus("Clipboard खाली है।", "error");
return;
}
let decodedText = text;
try{
decodedText = decodeURIComponent(text);
 }catch(error){
// अगर URL encoded नहीं है तो original text ही
रहेगा
}
const match = decodedText.match(
/SB99v1\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+/);
if(match){
messageBox.value = match[0];
clearSecurityError();
setStatus("📥 Secret code paste हो गया।", "success");
passwordBox.focus();
}else{
messageBox.value = text;
clearSecurityError();
setStatus("📥 Text paste हो गया।", "success");
}
}catch(error){
messageBox.focus();
setStatus(
"Clipboard access नहीं मिला। Textarea में long-press करके Paste करें।",
"warning"
);
}
}
/* ========================= 
MAIN BUTTON 
========================= */ 
lockButton.addEventListener( "click", async function(){ 
if(busy){ 
return;
}
const text = messageBox.value.trim();
if( isEncryptedCode(text)){ 
await unlockMessage();
}
else{ await lockMessage();
}
}
);
copyTextButton.addEventListener( "click", copyText ); 
clearTextButton.addEventListener("click", clearText);
pasteTextButton.addEventListener( "click", pasteText );
/* ==========================
MESSAGE INPUT
========================== */ 
messageBox.addEventListener( "input", function(){ 
clearSecurityError();
setStatus("");
}
); 
/* ========================= 
PASSWORD INPUT 
========================= */ 
passwordBox.addEventListener( "input", function(){ 
clearSecurityError();
}
);
/* =========================
LOAD CODE FROM LINK
========================= */
function loadCodeFromURL(){
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
if(!code){
return;
}
const match = code.match(
/SB99v1\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+/);
if(!match){
setStatus("❌ Invalid encrypted code.", "error");
return;
}
const cleanCode = match[0];
messageBox.value = cleanCode;
passwordBox.focus();
setStatus("🔐 Secret code तैयार है। अब password डालें।", "success");
}
loadCodeFromURL();
/* ========================= 
WEB CRYPTO CHECK 
========================= */ 
if(
!window.crypto || 
!window.crypto.subtle
){ 
setStatus( "इस browser में Web Crypto API उपलब्ध नहीं है।", "error");
lockButton.disabled = true;
}
</script> 
</body>
</html>
